name: Issue to local Codex

on:
  issues:
    types: [labeled]

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  check_issue:
    if: >-
      github.event.label.name == 'codex' &&
      github.event.issue.user.login == 'judgelight'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip closed Issues and existing task PRs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")"
          if ! jq -e '.user.login == "judgelight" and .state == "open" and any(.labels[]; .name == "codex")' <<< "$issue" >/dev/null; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.repo.full_name == \"$GITHUB_REPOSITORY\") | select(.head.ref | startswith(\"codex/issue-$ISSUE_NUMBER-\")) | .html_url")"
          if [[ -n "$existing" ]]; then
            body="$RUNNER_TEMP/existing-pr.md"
            printf '此 Issue 已有开放的 Codex PR，本次不重复执行：\n\n%s\n' "$existing" > "$body"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          fi

  implement:
    needs: check_issue
    if: needs.check_issue.outputs.proceed == 'true'
    runs-on: [self-hosted, linux, codex-local]
    timeout-minutes: 60
    env:
      CODEX_BRANCH: codex/issue-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local tools
        shell: bash
        run: |
          set -euo pipefail
          command -v codex
          command -v gh
          command -v jq
          codex login status

      - name: Create the local task branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$CODEX_BRANCH"

      - name: Mark the Issue as in progress
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: scripts/sync-project-status.sh "$ISSUE_URL" "In progress"

      - name: Let local Codex implement the issue
        id: codex
        shell: bash
        run: scripts/run-codex-issue.sh

      - name: Publish a pull request
        id: publish
        if: steps.codex.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_THREAD_ID: ${{ steps.codex.outputs.thread_id }}
          CODEX_FINAL_MESSAGE_FILE: ${{ runner.temp }}/codex-final-message.md
        run: |
          set -euo pipefail

          git config user.name "codex-local[bot]"
          git config user.email "codex-local[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"

          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${CODEX_BRANCH}"

          pr_body="${RUNNER_TEMP}/codex-pr-body.md"
          {
            printf '<!-- codex-thread-id: %s -->\n\n' "$CODEX_THREAD_ID"
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf '## Codex 执行摘要\n\n'
            if [[ -s "$CODEX_FINAL_MESSAGE_FILE" ]]; then
              sed -n '1,200p' "$CODEX_FINAL_MESSAGE_FILE"
            else
              printf 'Codex 已完成修改；没有生成执行摘要。\n'
            fi
            printf '\n\n---\n由本地 self-hosted runner 上的 Codex 自动生成，请在合并前审查。\n'
          } > "$pr_body"

          pr_url="$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$CODEX_BRANCH" \
            --title "fix: resolve issue #${ISSUE_NUMBER}" \
            --body-file "$pr_body")"
          gh issue comment "$ISSUE_NUMBER" --body "本地 Codex 已创建 PR：${pr_url}"
          printf 'pr_url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"

      - name: Mark the Issue and PR as in review
        if: steps.codex.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          scripts/sync-project-status.sh "$ISSUE_URL" "In review"
          scripts/sync-project-status.sh "$PR_URL" "In review"

      - name: Report that no patch was needed
        if: steps.codex.outputs.changed == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_FINAL_MESSAGE_FILE: ${{ runner.temp }}/codex-final-message.md
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/codex-no-change.md"
          {
            printf '本地 Codex 已完成分析，但没有产生代码改动。\n\n'
            sed -n '1,200p' "$CODEX_FINAL_MESSAGE_FILE"
          } > "$body"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body"

      - name: Mark an unchanged Issue as in review
        if: steps.codex.outputs.changed == 'false'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: scripts/sync-project-status.sh "$ISSUE_URL" "In review"

      - name: Restore the runner workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -ffdx
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          git branch -D "$CODEX_BRANCH" >/dev/null 2>&1 || true

      - name: Report failure or cancellation
        if: failure() || cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/codex-failure.md"
          printf 'Codex 自动实现失败或被取消，请人工检查后重新添加 codex 标签重试。\n\n运行记录：%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Return a failed Issue to review
        if: failure() || cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          script="$RUNNER_TEMP/failed-issue-status.sh"
          git show "origin/${DEFAULT_BRANCH}:scripts/sync-project-status.sh" > "$script"
          bash "$script" "$ISSUE_URL" "In review"
