name: Deploy main to local Docker

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - infra/docker-compose.yml
      - scripts/deploy-local.sh
      - .github/workflows/deploy-main-to-local-docker.yml
  workflow_dispatch:

concurrency:
  group: erex-local-docker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, codex-local]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: infra
      DEPLOY_ROOT: /home/judgelight/share/projects/EREX
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          command -v curl
          docker info >/dev/null

          test "$GITHUB_REF" = refs/heads/main
          test -r "$DEPLOY_ROOT/.env"
          test -r /srv/secrets/litellm.env
          docker network inspect shared_network >/dev/null
          docker network inspect ollama_default >/dev/null

      - name: Deploy in the local project
        shell: bash
        run: bash scripts/deploy-local.sh

      - name: Verify the deployed application
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 3 --max-time 10 http://127.0.0.1:8002/health \
              && curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --output /dev/null http://127.0.0.1:8002/; then
              printf '\nDeployment health check passed.\n'
              exit 0
            fi
            printf 'Health check attempt %s/12 failed; retrying in 5 seconds.\n' "$attempt" >&2
            sleep 5
          done
          printf 'Deployment health check failed.\n' >&2
          exit 1

      - name: Show container diagnostics on failure
        if: failure()
        shell: bash
        working-directory: /home/judgelight/share/projects/EREX/infra
        run: |
          docker compose --env-file ../.env ps || true
          printf 'Inspect application logs locally; container logs are not uploaded because they may contain private data.\n'
