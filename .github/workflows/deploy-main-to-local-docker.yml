name: Deploy main to local Docker

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - infra/docker-compose.yml
  workflow_dispatch:

concurrency:
  group: erex-local-docker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, codex-local]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: infra
      EREX_ENV_FILE: ${{ vars.EREX_ENV_FILE }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Verify local deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          command -v curl
          docker info >/dev/null

          if [[ -z "$EREX_ENV_FILE" || "$EREX_ENV_FILE" != /* ]]; then
            printf '%s\n' 'Set repository variable EREX_ENV_FILE to an absolute path readable by the runner.' >&2
            exit 1
          fi
          test -r "$EREX_ENV_FILE"
          test -r /srv/secrets/litellm.env
          docker network inspect shared_network >/dev/null
          docker network inspect ollama_default >/dev/null

      - name: Link the local environment file
        shell: bash
        run: ln -s "$EREX_ENV_FILE" "$GITHUB_WORKSPACE/.env"

      - name: Validate the Compose configuration
        shell: bash
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Rebuild and apply containers
        shell: bash
        run: docker compose -f infra/docker-compose.yml up -d --build --remove-orphans

      - name: Verify the deployed application
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error http://127.0.0.1:8002/health; then
              printf '\nDeployment health check passed.\n'
              exit 0
            fi
            printf 'Health check attempt %s/12 failed; retrying in 5 seconds.\n' "$attempt" >&2
            sleep 5
          done
          printf 'Deployment health check failed.\n' >&2
          exit 1

      - name: Show container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose -f infra/docker-compose.yml ps || true
          docker compose -f infra/docker-compose.yml logs --no-color --tail=200 || true

      - name: Remove the environment-file link
        if: always()
        shell: bash
        run: |
          if [[ -L "$GITHUB_WORKSPACE/.env" ]]; then
            unlink "$GITHUB_WORKSPACE/.env"
          fi
